name: Manual GUI release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching Directory.Build.props (for example v3.0.0)
        required: true
        type: string
      draft:
        description: Create a draft release for review
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: gui-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify source version and tag target
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import os, re, subprocess, xml.etree.ElementTree as ET
          tag = os.environ['RELEASE_TAG']
          version = ET.parse('Directory.Build.props').findtext('.//Version')
          if not re.fullmatch(r'v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?', tag) or tag != f'v{version}':
              raise SystemExit(f'Release tag must match Directory.Build.props: v{version}')
          existing = subprocess.run(['git', 'rev-parse', '--verify', f'refs/tags/{tag}^{{commit}}'], capture_output=True, text=True)
          if existing.returncode == 0 and existing.stdout.strip() != os.environ['GITHUB_SHA']:
              raise SystemExit('Existing release tag points at another commit')
          PY

  validate:
    needs: version
    uses: ./.github/workflows/validate-build.yml

  release:
    needs: [version, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gui-package-win-x64
          path: dist
      - name: Verify GUI package metadata and checksum
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, zipfile, xml.etree.ElementTree as ET
          version = ET.parse('Directory.Build.props').findtext('.//Version')
          stem = f'drcom4scutGUI-{version}-win-x64'
          archive = pathlib.Path('dist') / f'{stem}.zip'
          expected = archive.with_suffix('.zip.sha256').read_text().split()[0]
          if hashlib.sha256(archive.read_bytes()).hexdigest() != expected:
              raise SystemExit('GUI package checksum mismatch')
          with zipfile.ZipFile(archive) as package:
              metadata = json.loads(package.read(f'{stem}/BUILD-INFO.json'))
          if metadata.get('version') != version or metadata.get('runtime') != 'win-x64' or metadata.get('source_commit') != os.environ['GITHUB_SHA']:
              raise SystemExit('GUI package does not match the validated source')
          if metadata.get('source_dirty') is not False:
              raise SystemExit('Refusing a release package built from a modified source checkout')
          if metadata.get('self_contained') is not True or metadata.get('core_included') is not False:
              raise SystemExit('Unexpected GUI package layout')
          pathlib.Path('dist/SHA256SUMS').write_text(f'{expected}  {archive.name}\n')
          PY
      - name: Create GUI release from the validated commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          CREATE_DRAFT: ${{ inputs.draft }}
        run: |
          git fetch --tags --force origin
          if git show-ref --quiet --verify "refs/tags/$RELEASE_TAG"; then
            if [[ "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" != "$GITHUB_SHA" ]]; then
              echo 'Release tag changed during validation and points at another commit' >&2
              exit 1
            fi
          else
            git tag -- "$RELEASE_TAG" "$GITHUB_SHA"
          fi
          git push origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          args=("$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes)
          if [[ "$CREATE_DRAFT" == true ]]; then args+=(--draft); fi
          gh release create "${args[@]}" dist/*.zip dist/SHA256SUMS
