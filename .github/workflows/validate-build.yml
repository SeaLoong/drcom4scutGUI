name: Validate and build GUI

on:
  workflow_call:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  test-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Test package and result verification guards
        shell: bash
        run: python -B -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Restore portable tests from lock files
        run: dotnet restore drcom4scutGUI.Tests/drcom4scutGUI.Tests.csproj --locked-mode
      - name: Test credentials, configuration and child-process lifecycle
        run: dotnet test --project drcom4scutGUI.Tests/drcom4scutGUI.Tests.csproj --configuration Release --no-restore --report-trx --results-directory artifacts/test-results
      - name: Verify tests actually executed
        shell: bash
        run: python .github/scripts/check_test_results.py artifacts/test-results
      - name: Restore Windows GUI from lock files
        run: dotnet restore drcom4scutGUI/drcom4scutGUI.csproj --locked-mode
      - name: Build Windows GUI (cross-build on Linux)
        run: dotnet build drcom4scutGUI/drcom4scutGUI.csproj --configuration Release --no-restore -warnaserror
      - name: Publish self-contained Windows x64 GUI
        if: runner.os == 'Windows'
        run: dotnet publish drcom4scutGUI/drcom4scutGUI.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore --output artifacts/publish/win-x64
      - name: Package GUI with version and checksums
        if: runner.os == 'Windows'
        shell: bash
        run: python .github/scripts/package_release.py --publish-dir artifacts/publish/win-x64
      - name: Upload GUI package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gui-package-win-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gui-tests-${{ runner.os }}
          path: artifacts/test-results/*.trx
          if-no-files-found: warn
          retention-days: 14
